<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Events: Relive the Colorful Moments</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        /* Global Styles */
        :root {
            --primary: #6e45e2;
            --secondary: #88d3ce;
            --accent: #ff7e5f;
            --dark: #2d3436;
            --light: #f8f8f8;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            overflow-x: hidden;
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 80px;
            position: relative;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 2px;
        }

        /* Events Grid */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px;
            margin-bottom: 80px;
            perspective: 1000px;
        }

        .event-card {
            background-color: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            position: relative;
            opacity: 0;
            transform: translateY(50px);
        }

        .event-card.animate {
            opacity: 1;
            transform: translateY(0) rotateX(0);
        }

        .event-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        }

        .event-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .event-image {
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        .event-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0));
            z-index: 1;
        }

        .event-image span {
            position: relative;
            z-index: 2;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .event-details {
            padding: 25px;
            position: relative;
        }

        .event-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--dark);
            transition: color 0.3s ease;
        }

        .event-card:hover .event-title {
            color: var(--primary);
        }

        .event-date-location {
            font-size: 1rem;
            color: #666;
        }

        .event-date-location span {
            display: block;
            margin-bottom: 6px;
        }

        .event-date-location span:first-child {
            font-weight: 500;
            color: var(--accent);
        }

        /* Floating Particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            opacity: 0.3;
            filter: blur(1px);
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 80px;
            padding-top: 30px;
            position: relative;
        }

        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        footer p {
            color: #999;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .events-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }

        /* Animation Classes */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <header class="animate__animated animate__fadeInDown">
        <h1>Past Events: Relive the Colorful Moments</h1>
    </header>

    <main>
        <div class="events-grid" id="eventsGrid">
            <!-- Event 1 -->
            <div class="event-card" style="--card-color: #FF6B6B;">
                <div class="event-image" style="background: linear-gradient(135deg, #FF6B6B, #FF8E53);">
                    <span>1</span>
                </div>
                <div class="event-details">
                    <h3 class="event-title">Winter Illumination Tour</h3>
                    <div class="event-date-location">
                        <span>December 2023</span>
                        <span>Tokyo Midtown</span>
                    </div>
                </div>
            </div>

            <!-- Event 2 -->
            <div class="event-card" style="--card-color: #4ECDC4;">
                <div class="event-image" style="background: linear-gradient(135deg, #4ECDC4, #5563DE);">
                    <span>2</span>
                </div>
                <div class="event-details">
                    <h3 class="event-title">Studio Portrait Workshop</h3>
                    <div class="event-date-location">
                        <span>October 2023</span>
                        <span>Shibuya Studio</span>
                    </div>
                </div>
            </div>

            <!-- Event 3 -->
            <div class="event-card" style="--card-color: #FFBE0B;">
                <div class="event-image" style="background: linear-gradient(135deg, #FFBE0B, #FB5607);">
                    <span>3</span>
                </div>
                <div class="event-details">
                    <h3 class="event-title">Summer Festival Shoot</h3>
                    <div class="event-date-location">
                        <span>August 2023</span>
                        <span>Asakusa</span>
                    </div>
                </div>
            </div>

            <!-- Event 4 -->
            <div class="event-card" style="--card-color: #8338EC;">
                <div class="event-image" style="background: linear-gradient(135deg, #8338EC, #3A86FF);">
                    <span>4</span>
                </div>
                <div class="event-details">
                    <h3 class="event-title">Rainy Season Reflections</h3>
                    <div class="event-date-location">
                        <span>June 2023</span>
                        <span>Meguro River</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="animate__animated animate__fadeInUp">
        <p>© Made with Gamma</p>
    </footer>

    <!-- GSAP for advanced animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Create floating particles
            createParticles();
            
            // Animate cards on scroll
            animateCards();
            
            // Add hover effects
            setupHoverEffects();
            
            // Add click effects
            setupClickEffects();
        });

        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random properties
                const size = Math.random() * 20 + 5;
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                const delay = Math.random() * 5;
                const duration = Math.random() * 10 + 10;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}%`;
                particle.style.top = `${posY}%`;
                particle.style.opacity = Math.random() * 0.4 + 0.1;
                
                particlesContainer.appendChild(particle);
                
                // Animate particle
                gsap.to(particle, {
                    x: `${Math.random() * 100 - 50}px`,
                    y: `${Math.random() * 100 - 50}px`,
                    duration: duration,
                    delay: delay,
                    repeat: -1,
                    yoyo: true,
                    ease: "sine.inOut"
                });
            }
        }

        function animateCards() {
            const cards = document.querySelectorAll('.event-card');
            
            cards.forEach((card, index) => {
                gsap.to(card, {
                    opacity: 1,
                    y: 0,
                    rotationX: 0,
                    duration: 0.8,
                    delay: index * 0.15,
                    ease: "back.out(1.2)",
                    onComplete: () => {
                        card.classList.add('animate');
                    }
                });
            });
        }

        function setupHoverEffects() {
            const cards = document.querySelectorAll('.event-card');
            
            cards.forEach(card => {
                card.addEventListener('mouseenter', () => {
                    gsap.to(card, {
                        scale: 1.03,
                        y: -10,
                        boxShadow: '0 15px 40px rgba(0, 0, 0, 0.15)',
                        duration: 0.3,
                        ease: "power2.out"
                    });
                    
                    // Tilt effect
                    card.addEventListener('mousemove', tiltCard);
                });
                
                card.addEventListener('mouseleave', () => {
                    gsap.to(card, {
                        scale: 1,
                        y: 0,
                        boxShadow: '0 10px 30px rgba(0, 0, 0, 0.08)',
                        rotationX: 0,
                        rotationY: 0,
                        duration: 0.5,
                        ease: "elastic.out(1, 0.5)"
                    });
                    
                    card.removeEventListener('mousemove', tiltCard);
                });
            });
            
            function tiltCard(e) {
                const card = e.currentTarget;
                const cardRect = card.getBoundingClientRect();
                const cardCenterX = cardRect.left + cardRect.width / 2;
                const cardCenterY = cardRect.top + cardRect.height / 2;
                
                const angleX = (e.clientY - cardCenterY) / 20;
                const angleY = (cardCenterX - e.clientX) / 20;
                
                gsap.to(card, {
                    rotationX: angleX,
                    rotationY: angleY,
                    duration: 0.5,
                    ease: "power2.out"
                });
            }
        }

        function setupClickEffects() {
            const cards = document.querySelectorAll('.event-card');
            
            cards.forEach(card => {
                card.addEventListener('click', function() {
                    // Create ripple effect
                    const ripple = document.createElement('div');
                    ripple.style.position = 'absolute';
                    ripple.style.width = '10px';
                    ripple.style.height = '10px';
                    ripple.style.backgroundColor = 'rgba(255, 255, 255, 0.5)';
                    ripple.style.borderRadius = '50%';
                    ripple.style.pointerEvents = 'none';
                    ripple.style.transform = 'translate(-50%, -50%)';
                    
                    // Position ripple at click location
                    const rect = card.getBoundingClientRect();
                    const x = event.clientX - rect.left;
                    const y = event.clientY - rect.top;
                    ripple.style.left = `${x}px`;
                    ripple.style.top = `${y}px`;
                    
                    card.appendChild(ripple);
                    
                    // Animate ripple
                    gsap.to(ripple, {
                        scale: 20,
                        opacity: 0,
                        duration: 0.8,
                        ease: "power2.out",
                        onComplete: () => ripple.remove()
                    });
                    
                    // Bounce card
                    gsap.to(card, {
                        scale: 0.95,
                        duration: 0.2,
                        yoyo: true,
                        repeat: 1,
                        ease: "power2.inOut"
                    });
                    
                    console.log('Event clicked:', card.querySelector('.event-title').textContent);
                });
            });
        }
    </script>
</body>
</html>
