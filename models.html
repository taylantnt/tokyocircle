      document.addEventListener("DOMContentLoaded", function () {

        // Get all buttons within the #styles container
        const buttons = document.querySelectorAll("#styles button");

        // Function to handle button click
        function handleButtonClick(event) {
          // Remove the active class from all buttons
          buttons.forEach((button) => button.classList.remove("active"));

          // Add the active class to the clicked button
          event.target.classList.add("active");
        }

        // Add click event listener to each button
        buttons.forEach((button) => {
          button.addEventListener("click", handleButtonClick);
        });
      });

      // Add animation order for staggered effect
      document.addEventListener("DOMContentLoaded", function () {
        const gridItems = document.querySelectorAll(".galery-item");

          item.style.animationDelay = `${index * 0.1}s`;
        });
      });

      // Add 'scrolled' class to navbar when page is scrolled down
      window.addEventListener("scroll", function () {
        var navbar = document.querySelector(".navbar");
        if (window.scrollY > 50) {
          navbar.classList.add("scrolled");
        } else {
          navbar.classList.remove("scrolled");
        }
      });

      function loadGallery(category) {
        const gallery = document.getElementById("portfolio");
        gallery.classList.remove("show");
        setTimeout(() => {
          gallery.innerHTML = ""; // Clear existing gallery items
          galleryData[category].forEach((item) => {
            const galleryItem = document.createElement("a");
            galleryItem.className = "galery-item";
            galleryItem.href = item.link; // Set the link for the entire thumbnail
            galleryItem.innerHTML = `
            <img src="${item.src}" alt="${item.alt}">
            <div class="album-name">${item.name}<br>${item.year}</div>
          `;
            gallery.appendChild(galleryItem);
          });
          gallery.classList.add("show");
        }, 500); // Match the transition duration
      }

      document
        .getElementById("styles")
        .addEventListener("click", function (event) {
          if (event.target.tagName === "BUTTON") {
            event.preventDefault();
            const category = event.target.getAttribute("data-category");
            loadGallery(category);
          }
        });

      // Load initial gallery
      loadGallery("portraits");
    </script>
