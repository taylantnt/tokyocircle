<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Photo Gallery </title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="description" content="Browse through memories from our photography walks and meetups in Tokyo">
    <link rel="stylesheet" href="gallery.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<style>
    body {
        background: var(--bg-primary);
        min-height: 100vh;
        margin: 0;
        padding: 0;
    }
    
    .navbar {
        transition: background 0.5s ease;
    }
    
    main {
        background: var(--bg-primary);
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        padding: 25px;
        position: relative;
        z-index: 1;
    }
    
    .dark-mode main {
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
</style>

<header>
<nav class="navbar">
    <div class="container">
        <!-- Theme Toggle moved inside navbar container -->
        <div class="theme-toggle">
            <div class="toggle-wrapper">
                <input type="checkbox" id="theme-toggle" class="toggle-input">
                <label for="theme-toggle" class="toggle-label">
                    <div class="toggle-icons">
                        <i class="fas fa-sun"></i>
                        <i class="fas fa-moon"></i>
                    </div>
                </label>
            </div>
        </div>

        <a href="main.html" class="logo">
            <img src="https://cdn.glitch.global/a0def4c3-e1ef-4dec-a1b4-5c1abf13ecce/Apr%205%2C%202025%20at%2003_13_47%20PM.png?v=1743833940361" 
                 alt="Circle Photography Friends Logo" 
                 class="logo-image">
        </a>
        <button class="mobile-menu-btn">
            <i class="fas fa-bars"></i>
        </button>
        <div class="nav-links">
            <a href="main.html#about"><i class="fas fa-heart"></i> About</a>
            <a href="gallery.html" class="active"><i class="fas fa-images"></i> Gallery</a>
            <a href="main.html#events"><i class="fas fa-calendar-alt"></i> Events</a>
            <a href="main.html#hire-us"><i class="fas fa-briefcase"></i> Talents</a>
            <a href="main.html#join" class="btn"><i class="fas fa-user-plus"></i> Join</a>
        </div>
    </div>
</nav>
</header>

<main>
    <div class="page-title" role="banner">
        <h1>Our Photo Collection</h1>
        <p>Browse through memories from our walks and meetups</p>
    </div>
    
    <div class="gallery-grid" id="gallery" role="region" aria-label="Photo gallery grid"></div>

    <div class="viewer" role="dialog" aria-label="Image viewer" aria-modal="true" hidden>
        <div class="viewer-content">
            <img src="" alt="" class="viewer-img">
            <button class="nav-btn prev" aria-label="Previous image"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
            <button class="nav-btn next" aria-label="Next image"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
            <button class="close-btn" aria-label="Close viewer"><i class="fas fa-times" aria-hidden="true"></i></button>
        </div>
        <div class="viewer-thumbnails">
            <!-- Thumbnails will be dynamically added here -->
        </div>
    </div>
</main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-about">
                    <h3>⭕️ Circle</h3>
                    <div class="footer-social">
                        <a href="https://www.instagram.com/tokyocircle/" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                        <a href="https://line.me/ti/g/mJAkqUoScC" aria-label="Line"><i class="fab fa-line"></i></a>
                        <a href="https://www.meetup.com/circle/" aria-label="Meetup"><i class="fab fa-meetup"></i></a>
                    </div>
                </div>
                
                <div class="footer-links">
                    <h4>Quick Links</h4>
                    <a href="main.html#about"><i class="fas fa-heart"></i> About Us</a>
                    <a href="#gallery"><i class="fas fa-images"></i> Photo Gallery</a>
                    <a href="main.html#events"><i class="fas fa-calendar-alt"></i> Events</a>
                    <a href="main.html#hire-us"><i class="fas fa-briefcase"></i> Circle Talents</a>
                    <a href="main.html#join"><i class="fas fa-user-plus"></i> Join Us</a>
                </div>
                
                <div class="footer-contact">
                    <h4>Contact Us</h4>
                    <a href="mailto:hello@circletokyo.com"><i class="fas fa-envelope"></i> hello@circletokyo.com</a>
                    <a href="https://www.instagram.com/tokyocircle/"><i class="fas fa-camera"></i> Message on Instagram</a>
                </div>
            </div>
            
            <div class="footer-bottom">
                <p>Made with <i class="fas fa-heart heart"></i> by TT &copy; 2024</p>
            </div>
        </div>
    </footer>
<script>
const motion = window.matchMedia("(prefers-reduced-motion: no-preference)");

if (motion.matches) {
  const themeColorMeta = document.getElementById('theme-color');
  const navbar = document.querySelector('.navbar');
  let hue = 0;

  function getCurrentColor() {
    const isDarkMode = document.body.classList.contains('dark-mode');
    return isDarkMode
      ? `hsl(${hue}, 30%, 25%)`
      : `hsl(${hue}, 40%, 90%)`;
  }

  function updateColors() {
    hue = (hue + 1) % 360;
    const color = getCurrentColor();

    document.body.style.background = color;
    if (navbar) navbar.style.background = color;
    if (themeColorMeta) themeColorMeta.setAttribute('content', color);
  }

  setInterval(updateColors, 100);
}
</script>
<script src="gallery.js"></script>
<script src="script.js"></script>
</body>
</html>
