<script>
    // Image loading helper with improved error handling
    function loadImage(img, url, fallbackUrl) {
        return new Promise((resolve, reject) => {
            img.src = url;
            img.onload = () => {
                img.classList.add('loaded');
                resolve(img);
            };
            img.onerror = () => {
                if (fallbackUrl) {
                    console.warn(`Failed to load image: ${url}, trying fallback`);
                    img.src = fallbackUrl;
                    img.onload = () => {
                        img.classList.add('loaded');
                        resolve(img);
                    };
                    img.onerror = () => reject(new Error(`Failed to load fallback image: ${fallbackUrl}`));
                } else {
                    reject(new Error(`Failed to load image: ${url}`));
                }
            };
        });
    }

    // Add preloader function with improved caching
    function preloadImage(url) {
        if (preloadCache.has(url)) {
            return Promise.resolve(preloadCache.get(url));
        }
        
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                preloadCache.set(url, img);
                resolve(img);
            };
            img.onerror = () => reject(new Error(`Failed to preload image: ${url}`));
            img.src = url;
        });
    }

    // Add preloader cache

    const ERROR_IMAGE = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAwIiBoZWlnaHQ9IjgwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZmZlZmVmIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNCIgZmlsbD0iI2RjMzU0NSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPkVycm9yIGxvYWRpbmcuLi48L3RleHQ+PC9zdmc+';

    let currentImages = [];
    let currentIndex = 0;
    let currentView = 'albums'; // 'albums' or 'photos'

    document.addEventListener('DOMContentLoaded', async () => {
        await initGallery();

        // Dark Mode Toggle
        const themeToggle = document.getElementById('theme-toggle');
        const themeColorMeta = document.getElementById('theme-color');
        
        // Check for saved theme preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggle.checked = true;
            if (themeColorMeta) themeColorMeta.setAttribute('content', '#1a1a1a');
        }
        
        themeToggle.addEventListener('change', function() {
            if (this.checked) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark');
                if (themeColorMeta) themeColorMeta.setAttribute('content', '#1a1a1a');
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('theme', 'light');
                if (themeColorMeta) themeColorMeta.setAttribute('content', '#ffffff');
            }
        });
    });

    // Initialize gallery with error handling
    async function initGallery() {
        try {
            const gallery = document.getElementById('gallery');
            if (!gallery) {
                throw new Error('Gallery element not found');
            }
            gallery.innerHTML = '';
            
            // Add back button
            const backBtn = document.createElement('button');
            backBtn.className = 'back-to-albums';
            backBtn.innerHTML = '<i class="fas fa-arrow-left"></i> Back to Albums';
            backBtn.addEventListener('click', showAlbums);
            gallery.appendChild(backBtn);

            // Start preloading first image from each album
            albums.forEach(album => {
                if (album.photos && album.photos.length > 0) {
                    preloadImage(album.photos[0].url).catch(err => {
                        console.warn(`Preloading failed for ${album.title}:`, err);
                    });
                }
            });

            for (const album of albums) {
                const container = document.createElement('div');
                container.className = 'gallery-album';

                const img = document.createElement('img');
                img.src = PLACEHOLDER_IMAGE;
                img.alt = album.title;
                img.classList.add('gallery-thumb');

                try {
                    await loadImage(img, album.photos[0].url, ERROR_IMAGE);
                } catch (err) {
                    console.error(`Error loading thumbnail for ${album.title}:`, err);
                    img.src = ERROR_IMAGE;
                }

                container.appendChild(img);

                const title = document.createElement('h3');
                title.textContent = album.title;
                container.appendChild(title);

                container.addEventListener('click', () => {
                    showAlbumPhotos(album);
                });

                gallery.appendChild(container);
            }

            // Remove loading spinner if it exists
            const spinner = gallery.querySelector('.loading-spinner');
            if (spinner) {
                spinner.remove();
            }
        } catch (error) {
            console.error('Error initializing gallery:', error);
            const gallery = document.getElementById('gallery');
            if (gallery) {
                gallery.innerHTML = '<p class="error-message">Failed to load gallery. Please try again later.</p>';
            }
        }
    }

    // Load viewer image with improved error handling
    async function loadViewerImage(imageData) {
        const viewerImg = document.querySelector('.viewer-img');
        if (!viewerImg) return;

        viewerImg.src = PLACEHOLDER_IMAGE;
        viewerImg.classList.remove('loaded');

        try {
            await loadImage(viewerImg, imageData.url, ERROR_IMAGE);
        } catch (error) {
            console.error('Error loading viewer image:', error);
            viewerImg.src = ERROR_IMAGE;
        }

        updateImageCounter();
    }

    // Navigation functions
    function showNextImage() {
        currentIndex = (currentIndex + 1) % currentImages.length;
        loadViewerImage(currentImages[currentIndex]);
    }

    function showPrevImage() {
        currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
        loadViewerImage(currentImages[currentIndex]);
    }

    function updateImageCounter() {
        const counter = document.querySelector('.image-counter');
        if (counter) {
            counter.textContent = `${currentIndex + 1} / ${currentImages.length}`;
        }
    }

    // Event listeners for navigation
    document.querySelector('.next-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        showNextImage();
    });

    document.querySelector('.prev-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        showPrevImage();
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (!document.querySelector('.viewer.active')) return;
        
        switch(e.key) {
            case 'ArrowRight':
                showNextImage();
                break;
            case 'ArrowLeft':
                showPrevImage();
                break;
            case 'Escape':
                document.querySelector('.viewer').classList.remove('active');
                break;
        }
    });

    // Close viewer when clicking outside the image
    document.querySelector('.viewer').addEventListener('click', function(e) {
        if (e.target === this) {
            this.classList.remove('active');
        }
    });

    // Function to show all albums
    function showAlbums() {
        currentView = 'albums';
        document.querySelector('.back-to-albums').classList.remove('visible');
        initGallery();
    }

    // Function to show photos in an album
    async function showAlbumPhotos(album) {
        currentView = 'photos';
        currentImages = album.photos;
        currentIndex = 0;
        
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';
        
        // Show back button
        const backBtn = document.createElement('button');
        backBtn.className = 'back-to-albums visible';
        backBtn.innerHTML = '<i class="fas fa-arrow-left"></i> Back to Albums';
        backBtn.addEventListener('click', showAlbums);
        gallery.appendChild(backBtn);
        
        // Start preloading all photos in the album
        album.photos.forEach(photo => {
            preloadImage(photo.url).catch(err => {
                console.warn(`Preloading failed for photo:`, err);
            });
        });
        
        // Display all photos in the album
        for (const photo of album.photos) {
            const container = document.createElement('div');
            container.className = 'gallery-album';

            const img = document.createElement('img');
            img.src = PLACEHOLDER_IMAGE;
            img.alt = album.title;
            img.classList.add('gallery-thumb');

            try {
                await loadImage(img, photo.url, ERROR_IMAGE);
            } catch (err) {
                console.error(`Error loading photo:`, err);
                img.src = ERROR_IMAGE;
            }

            container.appendChild(img);

            container.addEventListener('click', () => {
                currentIndex = album.photos.indexOf(photo);
                const viewer = document.querySelector('.viewer');
                if (viewer) {
                    viewer.classList.add('active');
                    loadViewerImage(currentImages[currentIndex]);
                }
            });

            gallery.appendChild(container);
        }
    }

const motion = window.matchMedia("(prefers-reduced-motion: no-preference)");

if (motion.matches) {
  const themeColorMeta = document.getElementById('theme-color');
  const navbar = document.querySelector('.navbar');
  let hue = 0;

  function getCurrentColor() {
    const isDarkMode = document.body.classList.contains('dark-mode');
    return isDarkMode
      ? `hsl(${hue}, 30%, 25%)`
      : `hsl(${hue}, 40%, 90%)`;
  }

  function updateColors() {
    hue = (hue + 1) % 360;
    const color = getCurrentColor();

    document.body.style.background = color;
    if (navbar) navbar.style.background = color;
    if (themeColorMeta) themeColorMeta.setAttribute('content', color);
  }

  setInterval(updateColors, 100);
}
